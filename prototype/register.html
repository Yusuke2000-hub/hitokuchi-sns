<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 - Hitokuchi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo">Hitokuchi</a>
    </div>
  </header>

  <main class="page-content">
    <div class="auth-card">
      <h1 class="auth-card__title" style="font-size:20px">新規登録</h1>

      <form id="register-form" action="" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input class="form-input" type="text" id="username" name="username"
                 autocomplete="username" placeholder="hitokuchi_user" required>
          <div class="form-error" id="username-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <input class="form-input" type="email" id="email" name="email"
                 autocomplete="email" placeholder="example@mail.com" required>
          <div class="form-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">パスワード（8文字以上）</label>
          <input class="form-input" type="password" id="password" name="password"
                 autocomplete="new-password" placeholder="8文字以上のパスワード" required>
          <div class="form-error" id="password-error"></div>
        </div>
        <button type="submit" class="btn btn--primary btn--full" style="margin-top:8px">登録する</button>
      </form>

      <p class="auth-card__link">
        すでにアカウントをお持ちの方は
        <a href="login.html">ログインはこちら</a>
      </p>
    </div>
  </main>

  <!-- モーダル（共通） -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal__title">確認</div>
      <div class="modal__message" id="modal-message"></div>
      <div class="modal__actions">
        <button id="modal-cancel"  class="btn btn--secondary">キャンセル</button>
        <button id="modal-confirm" class="btn btn--danger">削除する</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
