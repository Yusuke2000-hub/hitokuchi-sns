<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - Hitokuchi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo">Hitokuchi</a>
    </div>
  </header>

  <main class="page-content">
    <div class="auth-card">
      <h1 class="auth-card__title">Hitokuchi</h1>
      <p class="auth-card__subtitle">ログイン</p>

      <div id="global-error" class="form-error hidden" style="margin-bottom:12px"></div>

      <form id="login-form" action="" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <input class="form-input" type="email" id="email" name="email"
                 autocomplete="email" placeholder="example@mail.com" required>
          <div class="form-error" id="email-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input class="form-input" type="password" id="password" name="password"
                 autocomplete="current-password" placeholder="パスワード" required>
          <div class="form-error" id="password-error"></div>
        </div>
        <button type="submit" class="btn btn--primary btn--full" style="margin-top:8px">ログイン</button>
      </form>

      <p class="auth-card__link">
        アカウントをお持ちでない方は
        <a href="register.html">新規登録はこちら</a>
      </p>
    </div>
    <!-- テスト用情報 -->
    <p style="text-align:center;font-size:13px;color:#9CA3AF;margin-top:16px">
      テスト用: user@example.com / password123
    </p>
  </main>

  <!-- モーダル（共通） -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal__title">確認</div>
      <div class="modal__message" id="modal-message"></div>
      <div class="modal__actions">
        <button id="modal-cancel"  class="btn btn--secondary">キャンセル</button>
        <button id="modal-confirm" class="btn btn--danger">削除する</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
