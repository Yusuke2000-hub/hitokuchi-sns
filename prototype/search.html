<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー検索 - Hitokuchi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
  <!-- ヘッダー -->
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo">Hitokuchi</a>
      <nav class="header__nav">
        <a href="#" id="header-profile-link" class="header__username">@---</a>
        <button id="header-logout-btn" class="btn btn--secondary btn--sm">ログアウト</button>
      </nav>
    </div>
  </header>

  <!-- サブヘッダー -->
  <div style="max-width:600px;margin:0 auto;background:#fff;border-bottom:1px solid var(--color-border)">
    <div class="sub-header">
      <a href="javascript:history.back()" class="sub-header__back">← 戻る</a>
      <span class="sub-header__title">ユーザーを探す</span>
    </div>
  </div>

  <!-- 検索フォーム -->
  <div style="max-width:600px;margin:0 auto">
    <div class="search-form">
      <input id="search-input" class="search-input" type="search"
             placeholder="ユーザー名で検索...">
      <button id="search-btn" class="btn btn--primary btn--sm">検索</button>
    </div>
  </div>

  <!-- 検索結果 -->
  <main class="page-content" style="padding-top:12px;padding-bottom:32px">
    <div id="result-list"></div>
  </main>

  <!-- モーダル（共通） -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal__title">確認</div>
      <div class="modal__message" id="modal-message"></div>
      <div class="modal__actions">
        <button id="modal-cancel"  class="btn btn--secondary">キャンセル</button>
        <button id="modal-confirm" class="btn btn--danger">削除する</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
